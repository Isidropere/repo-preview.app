<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CámbialoRD Mobile App - Flutter Cross Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CámbialoRD Mobile">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CámbialoRD Mobile App</title>
  <style>
    body {
      background-color: #f97316;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .flutter-loader {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="flutter-loader" id="flutter-loader">
    <div class="spinner"></div>
    <h2 style="margin:0; font-weight:800; font-size:2rem;">Cambialord</h2>
    <p style="opacity:0.9; margin-top:6px; font-size:0.95rem;">Compilando & Cargando Aplicativo Móvil Flutter...</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
